name: OpenAPI Quality Check

# this action runs only when the OpenAPI specs, the ruleset or the check itself change.
# It runs on pull requests against any base branch, not only main, so that a stacked
# pull request is checked before the branch below it has merged.
on:
  pull_request:
    paths:
      - 'api-spec/**/*.yaml'
      - 'api-spec/**/*.yml'
      - '.spectral.yaml'
      - '.github/actions/openapi-lint/**'
      - '.github/workflows/openapi_quality.yml'

permissions:
  contents: read

jobs:
  openapi_quality:
    runs-on: ubuntu-latest
    name: OpenAPI lint
    strategy:
      # one failing spec must not cancel the others
      fail-fast: false
      matrix:
        spec:
          - path: 'api-spec/v1/openapi.yaml'
            version: 'v1'
          - path: 'api-spec/v2/openapi.yaml'
            version: 'v2'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Report-only: findings are annotated on the pull request but never fail the job.
      # The specs already lint clean at zero errors and zero warnings, so this period is
      # to observe the check on real pull requests before the gate is switched on, which
      # happens when the action moves to pagopa/github-actions-template.
      - name: OpenAPI lint - ${{ matrix.spec.version }}
        uses: ./.github/actions/openapi-lint
        with:
          spec_path: ${{ matrix.spec.path }}
          fail_on_violation: false