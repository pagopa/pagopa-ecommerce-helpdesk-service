name: OpenAPI Quality Check

# runs when the specs, the ruleset or the check itself change, on any base branch
on:
  pull_request:
    paths:
      - 'api-spec/**/*.yaml'
      - 'api-spec/**/*.yml'
      - '.spectral.yaml'
      - '.github/actions/openapi-lint/**'
      - '.github/workflows/openapi_quality.yml'

permissions:
  contents: read

jobs:
  openapi_quality:
    runs-on: ubuntu-latest
    # an expression here stops GitHub appending the whole matrix combination
    name: Lint ${{ matrix.spec.version }}
    strategy:
      # one failing spec must not cancel the others
      fail-fast: false
      matrix:
        spec:
          - path: 'api-spec/v1/openapi.yaml'
            version: 'v1'
          - path: 'api-spec/v2/openapi.yaml'
            version: 'v2'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # report-only until the action moves to github-actions-template
      - name: Lint ${{ matrix.spec.path }}
        uses: ./.github/actions/openapi-lint
        with:
          spec_path: ${{ matrix.spec.path }}
          fail_on_violation: false